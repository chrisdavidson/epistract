<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Epistract mark: solid nodes are asserted facts (layer 1); the hollow
       amber node on a dashed edge is a hypothesis or gap (epistemic layer 2). -->
  <rect width="32" height="32" rx="7" fill="#1a1a2e"/>
  <g stroke="#4a6cf7" stroke-width="2.5" stroke-linecap="round">
    <line x1="8" y1="9" x2="9" y2="24"/>
    <line x1="8" y1="9" x2="18" y2="18"/>
    <line x1="9" y1="24" x2="18" y2="18"/>
  </g>
  <line x1="18" y1="18" x2="26" y2="7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2.5 2.5"/>
  <g fill="#4a6cf7" stroke="#1a1a2e" stroke-width="1.5">
    <circle cx="8" cy="9" r="4"/>
    <circle cx="9" cy="24" r="4"/>
    <circle cx="18" cy="18" r="4"/>
  </g>
  <circle cx="26" cy="7" r="3.2" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
</svg>
