# Per-domain crosswalk extraction spec for fda-product-labels.
#
# Declares, per axis: which entity types participate, and which value
# sources to try (in order -- the first source producing a non-empty
# canonical key wins for a given node). Canonicalisation itself (the
# normalizer chain) lives once in ../../crosswalks/pharma.yaml, not here.
axes:
  trial:
    entity_types: [CLINICAL_STUDY]
    # The registry ID sits under three different attribute keys across the
    # corpus and, for some nodes, only in the descriptive name -- so this
    # scans every attribute value plus the name rather than naming one key.
    sources:
      - from: any_attribute
      - from: name

  drug:
    entity_types: [DRUG_PRODUCT, ACTIVE_INGREDIENT]
    sources:
      - from: attribute
        key: generic_name
      - from: attribute
        key: substance_name
      - from: name
    identifiers:
      unii:
        from: attribute
        key: unii

  adverse_event:
    # ADVERSE_REACTION only -- deliberately NOT the warnings section. The
    # warnings vocabulary overlap with the pharmacovigilance AE set is
    # roughly one term against forty; admitting it collapses the axis.
    entity_types: [ADVERSE_REACTION]
    sources:
      - from: name
