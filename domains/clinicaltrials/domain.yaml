name: "Clinical Trials"
version: "1.0.0"
description: |
  Domain for extracting structured knowledge graphs from ClinicalTrials.gov
  protocol documents, IRB submissions, clinical study reports, and trial
  publications. Covers trial design, interventions, conditions, sponsors,
  enrollment populations, outcomes, and biomarkers. Optimized for post-build
  enrichment against the ClinicalTrials.gov v2 and PubChem PUG REST APIs.

system_context: |
  You are analyzing clinical trial documents to build a knowledge graph of
  trials, interventions, conditions, sponsors, investigators, outcomes,
  biomarkers, cohorts, populations, trial phases, sites, adverse events, organ
  systems, standard outcomes, outcome analyses, and statistical methods.

  NOMENCLATURE STANDARDS:
  - Trials: MUST use the NCT identifier (e.g. "NCT04303780") as the canonical
    name whenever the document cites one. Record any study acronym
    ("CodeBreaK 200") as an alias in attributes.trial_acronym.
  - Compounds: prefer INN (e.g. "sotorasib" not "AMG 510"); record codes as aliases.
  - Conditions: prefer MeSH terms.
  - Interventions: distinguish between COMPOUND (small molecule or biologic)
    and INTERVENTION (procedures, device use, lifestyle). Drug arms are
    extracted as BOTH a Compound entity and an Intervention entity linked by
    the `tests` relation.

  - Conditions: use one canonical MeSH-based name per disease across the
    whole corpus ("Type 2 Diabetes Mellitus", "Obesity", "Overweight").
    Split combined labels such as "overweight or obesity" into separate
    Condition entities.
  - Adverse events: name each AdverseEvent by the event term itself ("Nausea",
    "Acute pancreatitis"), never by the arm, timepoint or count. Use one node
    per distinct event term across all arms.
    Normalize names per SKILL.md 'Adverse Event Normalization' (rule-based, no MedDRA lookup); keep source wording in reported_term.
  - Standard outcomes: one StandardOutcome per canonical measure across the
    corpus ("HbA1c", "Body weight", "Systolic blood pressure"); strip "change
    from baseline in", timepoints and units. The trial-specific wording stays
    on the Outcome.
  - Statistical methods: one canonical spelling per method ("ANCOVA", "MMRM",
    "Paired t-test").

  PROTOCOL VS RESULT:
  - A protocol describes what a trial will test. Record that as
    evaluated_for (Compound/Intervention -> Condition), never as treats.
  - Use treats only when the text reports an observed result or an
    approved indication.
  - Comparator arms are compared_with, not co_intervention.
  - Extract an OutcomeAnalysis only when the text reports a result (an effect
    estimate or a p-value). Protocols produce none.

  CONFIDENCE CALIBRATION (score how strongly the text supports the
  extraction, not whether the treatment works):
  - 0.9-1.0: Explicitly stated with a clear citation (NCT ID, stated phase,
    named sponsor, listed primary endpoint).
  - 0.7-0.89: Strongly supported by context (inclusion criteria read as a
    selection biomarker, cohort inferred from an arm label).
  - 0.5-0.69: Inferred from indirect evidence (phase implied by design,
    condition implied by eligibility only).
  - below 0.5: Speculative; flag for review.

fallback_relation: ASSOCIATED_WITH

entity_types:
  Trial:
    description: "A clinical trial identified by an NCT registry ID or study acronym. Use the NCT ID as the canonical name."
    display: { family: Evidence, shape: star, color: "#5f66ed" }
  Intervention:
    description: "A procedure, behavioral intervention, device use, or non-drug therapy being studied."
    display: { family: Interventions, shape: hexagon, color: "#249e02" }
  Condition:
    description: "The disease, disorder, or indication being studied (e.g. 'Non-Small Cell Lung Cancer')."
    display: { family: Conditions, shape: square, color: "#ed4b43" }
  Sponsor:
    description: "Organization funding or running the trial — pharmaceutical companies, academic centers, government agencies."
    display: { family: Actors, shape: diamond, color: "#059eb1" }
  Investigator:
    description: "Principal investigator or key study personnel named in the protocol."
    display: { family: Actors, shape: diamond, color: "#cc54c5" }
  Outcome:
    description: "Primary, secondary, or exploratory outcome measure (e.g. 'overall survival', 'progression-free survival')."
    display: { family: Evidence, shape: star, color: "#926a0c" }
  Compound:
    description: "Small molecule, biologic, or drug candidate under investigation. Enriched via PubChem during --enrich."
    display: { family: Interventions, shape: hexagon, color: "#a35472" }
  Biomarker:
    description: "Measurable indicator used for patient selection, stratification, or response assessment."
    display: { family: Concepts, shape: triangleDown, color: "#158561" }
  Cohort:
    description: "A specific arm or group within the trial (e.g. 'Arm A: sotorasib 960 mg QD')."
    display: { family: Populations, shape: triangle, color: "#937dc7" }
  Population:
    description: "The inclusion/exclusion-defined patient population for the trial."
    display: { family: Populations, shape: triangle, color: "#9344c8" }
  TrialPhase:
    description: "The regulatory phase designation — Phase 1, Phase 2, Phase 2/3, Phase 3, Phase 4, or Observational."
    display: { family: Evidence, shape: star, color: "#3875af" }
  Site:
    description: "A clinical study site — specific hospital, clinic, or country listed as a location."
    display: { family: Actors, shape: diamond, color: "#889541" }
  AdverseEvent:
    description: "An adverse event or side effect reported among trial participants (e.g. 'Nausea', 'Acute pancreatitis'). Name it by the event itself, not by the arm or timepoint. Source wording goes in attributes.reported_term; attributes.meddra_pt only when confident of the MedDRA PT wording, or when supplied by the ClinicalTrials.gov registry (never looked up by this tool). Registry-imported adverse events (enrich.py --results) carry attributes.source ctgov_results and ctgov_nct_ids."
    display: { family: Conditions, shape: square, color: "#d9480f" }
  OrganSystem:
    description: "The body or organ system an adverse event affects, named at system-organ-class level (e.g. 'Gastrointestinal disorders', 'Cardiac disorders')."
    display: { family: Concepts, shape: triangleDown, color: "#5c7cfa" }
  StandardOutcome:
    description: "A canonical, reusable outcome measure or assessment instrument shared across trials (e.g. 'HbA1c', 'Body weight', 'Systolic blood pressure', 'SF-36 physical functioning', 'Overall survival'). The trial-specific wording stays on the Outcome node."
    display: { family: Evidence, shape: star, color: "#0b7285" }
  OutcomeAnalysis:
    description: "A reported statistical comparison of arms on one outcome: the effect estimate, confidence interval, and p-value for treatment vs comparator at a timepoint. Registry-imported analyses (enrich.py --results) carry attributes.source ctgov_results and ctgov_nct_ids."
    display: { family: Evidence, shape: star, color: "#c2255c" }
  StatisticalMethod:
    description: "A statistical test or model used in an OutcomeAnalysis (e.g. 'ANCOVA', 'MMRM', 'Cox proportional hazards', 'Log-rank test')."
    display: { family: Concepts, shape: triangleDown, color: "#5f3dc4" }

relation_types:
  tests:
    description: "A Trial tests a Compound or Intervention."
    category: therapeutic
    source_types: [Trial]
    target_types: [Compound, Intervention]
  treats:
    description: "A Compound or Intervention has shown or approved efficacy for a Condition. Use only when the text reports a result or an approved indication. For a trial that is testing the treatment, use evaluated_for."
    category: therapeutic
    source_types: [Compound, Intervention]
    target_types: [Condition]
  evaluated_for:
    description: "A Compound or Intervention is being tested as a treatment for a Condition (protocol intent, no result yet)."
    category: therapeutic
    source_types: [Compound, Intervention]
    target_types: [Condition]
  compared_with:
    description: "Two Compounds or Interventions are given in separate arms and compared against each other (active comparator, head-to-head, or placebo control)."
    category: therapeutic
    source_types: [Compound, Intervention]
    target_types: [Compound, Intervention]
    symmetric: true
  sponsored_by:
    description: "A Trial is sponsored by a Sponsor."
    category: organizational
    source_types: [Trial]
    target_types: [Sponsor]
  has_outcome:
    description: "A Trial has a specified Outcome (endpoint)."
    category: association
    source_types: [Trial]
    target_types: [Outcome]
  uses_biomarker:
    description: "A Trial uses a Biomarker for patient selection, stratification, or response assessment."
    category: association
    source_types: [Trial]
    target_types: [Biomarker]
  enrolls:
    description: "A Trial enrolls a specific Population or Cohort."
    category: structural
    source_types: [Trial]
    target_types: [Population, Cohort]
  investigates:
    description: "A Trial investigates a Condition."
    category: organizational
    source_types: [Trial]
    target_types: [Condition]
  targets:
    description: "A Compound targets a Biomarker (e.g. sotorasib targets KRAS G12C)."
    category: mechanism
    source_types: [Compound]
    target_types: [Biomarker]
  is_phase:
    description: "A Trial is of a given TrialPhase."
    category: structural
    source_types: [Trial]
    target_types: [TrialPhase]
  co_intervention:
    description: "Two Interventions or Compounds are co-administered in the same Cohort. Not for comparator arms; use compared_with."
    category: therapeutic
    source_types: [Compound, Intervention]
    target_types: [Compound, Intervention]
    symmetric: true
  reports_adverse_event:
    description: "A Trial reports an AdverseEvent among its participants."
    category: provenance
    source_types: [Trial]
    target_types: [AdverseEvent]
  observed_in:
    description: "An AdverseEvent was observed in a specific arm/Cohort; put counts (n_affected, n_at_risk, percent) in relation evidence/attributes."
    category: association
    source_types: [AdverseEvent]
    target_types: [Cohort]
  affects_organ_system:
    description: "An AdverseEvent belongs to an OrganSystem."
    category: structural
    source_types: [AdverseEvent]
    target_types: [OrganSystem]
  receives:
    description: "A Cohort/arm receives a Compound or Intervention (CTKG Drug–EventGroup)."
    category: therapeutic
    source_types: [Cohort]
    target_types: [Compound, Intervention]
  contains_compound:
    description: 'A dose- or regimen-specific Intervention ("Semaglutide 0.5 mg QW SC") contains a Compound ("semaglutide").'
    category: structural
    source_types: [Intervention]
    target_types: [Compound]
  uses_background_drug:
    description: "Background, rescue, or auxiliary medication used in the trial but not under study (CTKG UsedDrug), e.g. metformin background therapy."
    category: therapeutic
    source_types: [Trial]
    target_types: [Compound, Intervention]
  measures:
    description: "A trial-specific Outcome measures a canonical StandardOutcome (CTKG Outcome–StandardOutcome)."
    category: association
    source_types: [Outcome]
    target_types: [StandardOutcome]
  analyzes:
    description: "An OutcomeAnalysis analyses a specific Outcome."
    category: association
    source_types: [OutcomeAnalysis]
    target_types: [Outcome]
  compares:
    description: "An OutcomeAnalysis compares this arm (one edge per arm compared)."
    category: structural
    source_types: [OutcomeAnalysis]
    target_types: [Cohort]
  assesses_effect_of:
    description: "The treatment whose effect the OutcomeAnalysis estimates (the experimental side of the comparison)."
    category: therapeutic
    source_types: [OutcomeAnalysis]
    target_types: [Compound, Intervention]
  uses_method:
    description: "The StatisticalMethod used for the analysis."
    category: structural
    source_types: [OutcomeAnalysis]
    target_types: [StatisticalMethod]
