# Per-domain crosswalk extraction spec for clinicaltrials.
#
# Declares, per axis: which entity types participate, and which value
# sources to try (in order). Canonicalisation itself (the normalizer chain)
# lives once in ../../crosswalks/pharma.yaml, not here.
axes:
  trial:
    entity_types: [Trial]
    # Trial nodes are named with the bare registry ID; fall back to
    # attributes for the rare node where the name alone doesn't carry it.
    sources:
      - from: name
      - from: any_attribute

  drug:
    entity_types: [Compound]
    sources:
      - from: attribute
        key: inn
      - from: name

  outcome:
    # StandardOutcome first: the canonical measure name ("HbA1c",
    # "Body weight") is the key that can meet another graph. Outcome stays
    # as a fallback for graphs extracted before StandardOutcome existed.
    entity_types: [StandardOutcome, Outcome]
    sources:
      - from: name

  adverse_event:
    # Same attribute key as domains/pharmacovigilance/crosswalk.yaml, so a
    # cross-domain join needs no rename. AE nodes without meddra_pt fall
    # through to their name; the normalizer chain lives in
    # crosswalks/pharma.yaml.
    entity_types: [AdverseEvent]
    sources:
      - from: attribute
        key: meddra_pt
      - from: name

edges:
  - subject: trial
    object: outcome
    relations: [has_outcome]
  - subject: trial
    object: adverse_event
    relations: [reports_adverse_event]

  # The adverse_event axis is populated only by graphs extracted with the
  # AdverseEvent type; graphs built before it contribute no keys.
